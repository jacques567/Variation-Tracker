<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Poppins', system-ui, sans-serif; }
    a { color: #0057B8; text-decoration: none; }
    a:hover { color: #003D82; text-decoration: underline; }
    a:focus-visible, button:focus-visible { outline: 2px solid #0057B8; outline-offset: 2px; border-radius: 4px; }
    input::placeholder { color: #6B7280; }
    input:focus { outline: none; border-color: #0057B8; box-shadow: 0 0 0 3px rgba(0,87,184,0.15); }
  </style>
</helmet>

<div style="width:390px; height:844px; position:relative; background-color:#E6EAF0; display:flex; align-items:center; justify-content:center; overflow:hidden; padding:32px 24px;">

  <img src="bg-desktop.jpg" alt="" width="390" height="844" style="position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:32% 30%; z-index:0;">

  <div style="position:relative; z-index:1; width:100%; background:#FFFFFF; border-radius:12px; box-shadow:0 20px 60px rgba(15,23,32,0.14), 0 2px 8px rgba(15,23,32,0.06); overflow:hidden; display:flex; flex-direction:column;">

    <div style="padding:26px 22px 20px 22px; display:flex; flex-direction:column; gap:16px;">

      <div style="display:flex; align-items:center; justify-content:center; gap:8px;">
        <img src="./logo.png" alt="VarTracker" width="51" height="68" style="height:68px; object-fit:contain; width:51px">
        <span style="font-size:24px; font-weight:700; color:#0F1720; letter-spacing:-0.01em;">VarTracker</span>
      </div>

      <h1 style="margin:0; text-align:center; font-size:24px; font-weight:600; color:#0057B8;">Log in to Your Account</h1>

      <div style="display:flex; flex-direction:column; gap:6px;">
        <label for="login-email" style="font-size:14px; font-weight:600; color:#0F1720;">Email Address</label>
        <div style="position:relative; display:flex; align-items:center;">
          <input id="login-email" type="email" name="email" autocomplete="email" spellcheck="false" placeholder="you@company.com" style="width:100%; height:48px; padding:0 40px 0 14px; border:1px solid #AEB8C7; border-radius:12px; font-family:'Poppins', sans-serif; font-size:16px; color:#0F1720; background:#FFFFFF;">
          <svg aria-hidden="true" style="position:absolute; right:14px; pointer-events:none;" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6B7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"></rect><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path></svg>
        </div>
      </div>

      <div style="display:flex; flex-direction:column; gap:6px;">
        <label for="login-password" style="font-size:14px; font-weight:600; color:#0F1720;">Password</label>
        <div style="position:relative; display:flex; align-items:center;">
          <input id="login-password" type="password" name="password" autocomplete="current-password" placeholder="Enter your password" style="width:100%; height:48px; padding:0 40px 0 14px; border:1px solid #AEB8C7; border-radius:12px; font-family:'Poppins', sans-serif; font-size:16px; color:#0F1720; background:#FFFFFF;">
          <svg aria-hidden="true" style="position:absolute; right:14px; pointer-events:none;" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6B7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"></path><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"></path><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"></path><line x1="2" y1="2" x2="22" y2="22"></line></svg>
        </div>
      </div>

      <button type="submit" style="width:100%; height:48px; background:#0057B8; color:#FFFFFF; border:none; border-radius:12px; font-family:'Poppins', sans-serif; font-size:14px; font-weight:600; cursor:pointer;">Log In</button>

      <a href="#" style="text-align:center; font-size:14px; font-weight:500;">Forgot password?</a>

    </div>

    <div style="border-top:1px solid #EEF1F5; padding:14px 22px; text-align:center;">
      <span style="font-size:12px; color:#4B5563;">Don&#8217;t have an account? </span>
      <a href="#" style="font-size:12px; font-weight:600;">Contact Support</a>
    </div>

  </div>

</div>
</x-dc>
</body>
</html>
