<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Poppins', system-ui, sans-serif; }
    a { text-decoration: none; }
    a:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible, label:focus-visible { outline: 2px solid #0057B8; outline-offset: 2px; border-radius: 4px; }
    textarea::placeholder, input::placeholder { color: #6B7280; }
    input:focus, textarea:focus { outline: none; border-color: #0057B8 !important; box-shadow: 0 0 0 3px rgba(0,87,184,0.15); }
  </style>
</helmet>

<div style="width:390px; min-height:780px; position:relative; background-color:#E6EAF0;">

  <img src="bg-app.jpg" alt="" style="position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:center; opacity:0.5; transform:scale(0.5); transform-origin:center; z-index:0;">

  <div style="position:relative; z-index:1; display:flex; flex-direction:column; min-height:780px;">

    <!-- NavBar -->
    <header style="background:#FFFFFF; border-bottom:1px solid #E6EAF0;">
      <div style="height:56px; display:flex; align-items:center; justify-content:space-between; padding:0 16px;">
        <div style="display:flex; align-items:center; gap:7px;">
          <img src="./logo.png" alt="" width="40" height="40" style="width:40px; height:40px; object-fit:contain;">
          <span style="font-size:15px; font-weight:700; color:#0F1720; letter-spacing:-0.01em;">VarTracker</span>
        </div>
        <a href="#" aria-label="Sign out" style="display:flex; align-items:center; justify-content:center; color:#6B7280; width:44px; height:44px; margin-right:-13px;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6B7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </a>
      </div>
    </header>

    <main style="flex:1; width:100%; padding:16px 16px 40px;">

      <a href="#" style="display:inline-flex; align-items:center; gap:6px; font-size:13px; color:#6B7280; margin-bottom:16px;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#6B7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        Back to job
      </a>

      <h1 style="margin:0 0 14px; font-size:19px; font-weight:600; color:#0F1720;">Log variation</h1>

      <div style="background:#FFFFFF; border:1px solid #E6EAF0; border-radius:12px; padding:18px; box-shadow:0 1px 2px rgba(15,23,32,0.04);">
        <form style="display:flex; flex-direction:column; gap:16px;">

          <div>
            <label style="display:block; font-size:13px; font-weight:600; color:#0F1720; margin-bottom:6px;">Description <span style="color:#DC2626;">*</span></label>
            <textarea rows="3" placeholder="e.g. Additional soil removal required" style="width:100%; padding:12px; border:1px solid #AEB8C7; border-radius:10px; font-family:'Poppins',sans-serif; font-size:15px; color:#0F1720; background:#FFFFFF; resize:none;"></textarea>
          </div>

          <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
            <div>
              <label style="display:block; font-size:13px; font-weight:600; color:#0F1720; margin-bottom:6px;">Cost <span style="color:#DC2626;">*</span></label>
              <div style="position:relative;">
                <span style="position:absolute; left:12px; top:50%; transform:translateY(-50%); font-size:15px; color:#6B7280;">&#163;</span>
                <input type="text" placeholder="350.00" style="width:100%; height:46px; padding:0 10px 0 26px; border:1px solid #AEB8C7; border-radius:10px; font-family:'Poppins',sans-serif; font-size:15px; color:#0F1720; background:#FFFFFF;">
              </div>
            </div>
            <div>
              <label style="display:block; font-size:13px; font-weight:600; color:#0F1720; margin-bottom:6px;">Date <span style="color:#DC2626;">*</span></label>
              <input type="text" value="23/08/2026" style="width:100%; height:46px; padding:0 10px; border:1px solid #AEB8C7; border-radius:10px; font-family:'Poppins',sans-serif; font-size:14px; color:#0F1720; background:#FFFFFF;">
            </div>
          </div>

          <div>
            <label style="display:block; font-size:13px; font-weight:600; color:#0F1720; margin-bottom:6px;">Photo proof <span style="font-weight:400; color:#6B7280;">(optional, max 5MB)</span></label>
            <div style="position:relative; width:100%; border-radius:10px; overflow:hidden; border:1px solid #E6EAF0;">
              <svg width="100%" height="150" viewBox="0 0 350 150" preserveAspectRatio="xMidYMid slice" style="display:block; background:#EEF2F6;">
                <rect width="350" height="150" fill="#EEF2F6"/>
                <path d="M0 110 L70 60 L120 95 L180 40 L240 90 L280 65 L350 105 L350 150 L0 150 Z" fill="#D8E0EA"/>
                <circle cx="290" cy="35" r="18" fill="#F2C94C"/>
                <rect x="150" y="70" width="34" height="50" fill="#AEB8C7" opacity="0.6"/>
              </svg>
              <button type="button" aria-label="Remove photo" style="position:absolute; top:8px; right:8px; background:#FFFFFF; border:1px solid #E6EAF0; border-radius:99px; width:44px; height:44px; display:flex; align-items:center; justify-content:center; cursor:pointer;">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#374151" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
              </button>
            </div>
          </div>

          <div style="display:flex; flex-direction:column; gap:10px; padding-top:2px;">
            <button type="submit" style="width:100%; background:#0057B8; color:#FFFFFF; border:none; border-radius:10px; padding:13px; font-family:'Poppins',sans-serif; font-size:15px; font-weight:600; cursor:pointer;">Log variation</button>
            <a href="#" style="width:100%; text-align:center; padding:13px; border:1px solid #AEB8C7; border-radius:10px; font-size:15px; font-weight:600; color:#0F1720;">Cancel</a>
          </div>

        </form>
      </div>
    </main>
  </div>
</div>
</x-dc>
</body>
</html>
