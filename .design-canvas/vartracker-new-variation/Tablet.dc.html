<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Poppins', system-ui, sans-serif; }
    a { text-decoration: none; }
    a:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible, label:focus-visible { outline: 2px solid #0057B8; outline-offset: 2px; border-radius: 4px; }
    textarea::placeholder, input::placeholder { color: #6B7280; }
    input:focus, textarea:focus { outline: none; border-color: #0057B8 !important; box-shadow: 0 0 0 3px rgba(0,87,184,0.15); }
  </style>
</helmet>

<div style="width:834px; min-height:750px; position:relative; background-color:#E6EAF0;">

  <img src="bg-app.jpg" alt="" style="position:absolute; inset:0; width:100%; height:100%; object-fit:cover; opacity:0.5; transform:scale(0.8); transform-origin:center; z-index:0;">

  <div style="position:relative; z-index:1; display:flex; flex-direction:column; min-height:750px;">

    <!-- NavBar -->
    <header style="background:#FFFFFF; border-bottom:1px solid #E6EAF0;">
      <div style="height:60px; display:flex; align-items:center; justify-content:space-between; padding:0 20px;">
        <div style="display:flex; align-items:center; gap:8px;">
          <img src="./logo.png" alt="" width="44" height="44" style="width:44px; height:44px; object-fit:contain;">
          <span style="font-size:16px; font-weight:700; color:#0F1720; letter-spacing:-0.01em;">VarTracker</span>
        </div>
        <div style="display:flex; align-items:center; gap:20px;">
          <a href="#" style="font-size:14px; color:#4B5563;">Categories</a>
          <a href="#" style="font-size:14px; color:#4B5563;">Admin</a>
          <div style="display:flex; align-items:center; gap:14px;">
            <span style="font-size:14px; color:#6B7280;">Dave Whitfield</span>
            <a href="#" style="display:flex; align-items:center; gap:6px; font-size:14px; color:#6B7280;">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#6B7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
              Sign out
            </a>
          </div>
        </div>
      </div>
    </header>

    <main style="flex:1; width:100%; padding:20px 20px 48px;">

      <a href="#" style="display:inline-flex; align-items:center; gap:6px; font-size:14px; color:#6B7280; margin-bottom:18px;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#6B7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        Back to job
      </a>

      <h1 style="margin:0 0 18px; font-size:28px; font-weight:600; color:#0F1720;">Log variation</h1>

      <div style="max-width:600px; background:#FFFFFF; border:1px solid #E6EAF0; border-radius:12px; padding:28px; box-shadow:0 1px 2px rgba(15,23,32,0.04);">
        <form style="display:flex; flex-direction:column; gap:18px;">

          <div>
            <label style="display:block; font-size:14px; font-weight:600; color:#0F1720; margin-bottom:6px;">Description <span style="color:#DC2626;">*</span></label>
            <textarea rows="3" placeholder="e.g. Additional soil removal required due to unexpected rock layer at 1.2m depth" style="width:100%; padding:12px 14px; border:1px solid #AEB8C7; border-radius:10px; font-family:'Poppins',sans-serif; font-size:14px; color:#0F1720; background:#FFFFFF; resize:none;"></textarea>
          </div>

          <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px;">
            <div>
              <label style="display:block; font-size:14px; font-weight:600; color:#0F1720; margin-bottom:6px;">Cost <span style="color:#DC2626;">*</span></label>
              <div style="position:relative;">
                <span style="position:absolute; left:14px; top:50%; transform:translateY(-50%); font-size:14px; color:#6B7280;">&#163;</span>
                <input type="text" placeholder="350.00" style="width:100%; height:44px; padding:0 14px 0 28px; border:1px solid #AEB8C7; border-radius:10px; font-family:'Poppins',sans-serif; font-size:14px; color:#0F1720; background:#FFFFFF;">
              </div>
            </div>
            <div>
              <label style="display:block; font-size:14px; font-weight:600; color:#0F1720; margin-bottom:6px;">Date <span style="color:#DC2626;">*</span></label>
              <div style="position:relative;">
                <input type="text" value="23/08/2026" style="width:100%; height:44px; padding:0 40px 0 14px; border:1px solid #AEB8C7; border-radius:10px; font-family:'Poppins',sans-serif; font-size:14px; color:#0F1720; background:#FFFFFF;">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6B7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="position:absolute; right:14px; top:50%; transform:translateY(-50%); pointer-events:none;"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
              </div>
            </div>
          </div>

          <div>
            <label style="display:block; font-size:14px; font-weight:600; color:#0F1720; margin-bottom:6px;">Photo proof <span style="font-weight:400; color:#6B7280;">(optional, max 5MB)</span></label>
            <label style="display:flex; flex-direction:column; align-items:center; justify-content:center; width:100%; height:120px; border-radius:10px; border:2px dashed #AEB8C7; cursor:pointer;">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6B7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom:6px;"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
              <span style="font-size:14px; color:#6B7280;">Tap to upload photo or receipt</span>
            </label>
          </div>

          <div style="display:flex; gap:12px; padding-top:4px;">
            <a href="#" style="flex:1; text-align:center; padding:12px; border:1px solid #AEB8C7; border-radius:10px; font-size:14px; font-weight:600; color:#0F1720;">Cancel</a>
            <button type="submit" style="flex:1; background:#0057B8; color:#FFFFFF; border:none; border-radius:10px; padding:12px; font-family:'Poppins',sans-serif; font-size:14px; font-weight:600; cursor:pointer;">Log variation</button>
          </div>

        </form>
      </div>
    </main>
  </div>
</div>
</x-dc>
</body>
</html>
